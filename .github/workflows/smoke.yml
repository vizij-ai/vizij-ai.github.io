name: Smoke CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.SEMIO_PACKAGES_READ_TOKEN }}

      - name: Resolve hub owner
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_hub_sync }}
        id: hub_owner
        env:
          HUB_REPO: ${{ inputs.hub_repo }}
        run: echo "owner=${HUB_REPO%%/*}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub App token
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_hub_sync }}
        id: app_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.SEMIO_GH_APP_ID }}
          private-key: ${{ secrets.SEMIO_GH_APP_PRIVATE_KEY }}
          owner: ${{ steps.hub_owner.outputs.owner }}

      - name: Sync content hub (no-op if hub is unavailable)
        run: npm run content:sync:hub

      - name: Generate CMS config
        run: npm run cms:config

      - name: Build site
        run: npm run build:site
